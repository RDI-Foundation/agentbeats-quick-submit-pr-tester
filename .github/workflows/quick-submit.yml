name: Quick Submit

on:
  pull_request:
    types: [opened, reopened]
    branches: [agentbeats-e2e-quick-submit-02bab49e50]

jobs:
  run-scenario:
    if: startsWith(github.head_ref, 'quick-submit-')
    uses: RDI-Foundation/agentbeats-leaderboard-template/.github/workflows/quick-submit-runner.yml@v2
    with:
      backend_url: "https://tablets-printer-tend-lending.trycloudflare.com"
    permissions:
      id-token: write
      contents: write
      packages: read
