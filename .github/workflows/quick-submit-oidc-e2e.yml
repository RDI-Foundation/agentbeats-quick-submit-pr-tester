name: Quick Submit Scenario (PR)

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

jobs:
  run:
    if: startsWith(github.head_ref, 'quick-submit-')
    uses: RDI-Foundation/agentbeats-quick-submit-pr-tester/.github/workflows/workflow.yml@main
    permissions:
      id-token: write
      contents: read
